<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCK-Site Activities Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Verdana, sans-serif; background: #f7f7f7; color: #1f1f1f; padding: 20px; }
  .container { max-width: 1200px; margin: auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .header h1 { font-size: 1.4em; }
  .search-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .search-box { position: relative; flex: 1; min-width: 220px; }
  .search-box input { width: 100%; padding: 11px 36px 11px 38px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95em; font-family: inherit; background: white; }
  .search-box input:focus { outline: none; border-color: #6D3EF3; box-shadow: 0 0 0 3px rgba(109,62,243,0.12); }
  .search-box .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #999; font-size: 1em; pointer-events: none; }
  .search-box .clear-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: none; background: #eee; color: #666; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 0.9em; line-height: 1; display: none; }
  .search-box.has-value .clear-btn { display: block; }
  .search-box .clear-btn:hover { background: #ddd; }
  .btn-clear { border: 1px solid #ddd; background: white; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9em; font-weight: 600; color: #666; display: none; }
  .btn-clear.show { display: inline-block; }
  .btn-clear:hover { background: #f0f0f0; }
  .site-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .site-tab { background: white; border: 1px solid #e0e0e0; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: all 0.15s; }
  .site-tab:hover { border-color: #6D3EF3; }
  .site-tab.active { background: #6D3EF3; color: white; border-color: #6D3EF3; }
  .site-tab .count { opacity: 0.7; font-size: 0.85em; margin-left: 4px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: white; padding: 14px 16px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); transition: all 0.15s; border: 2px solid transparent; user-select: none; }
  .stat-card.filterable { cursor: pointer; }
  .stat-card.filterable:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .stat-card.active { border-color: #6D3EF3; box-shadow: 0 4px 12px rgba(109,62,243,0.2); }
  .stat-card .stat-label { font-size: 0.75em; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .stat-card .stat-value { font-size: 1.5em; font-weight: bold; }
  .stat-value.purple { color: #6D3EF3; }
  .stat-value.green { color: #28a745; }
  .stat-value.yellow { color: #d39e00; }
  .stat-value.red { color: #dc3545; }
  .stat-value.gray { color: #6c757d; }
  .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .card-title { font-size: 1.05em; font-weight: bold; }
  .filter-badge { display: inline-block; background: #eef0ff; color: #6D3EF3; padding: 3px 10px; border-radius: 12px; font-size: 0.75em; margin-left: 8px; font-weight: 600; }
  .btn { border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9em; font-weight: 600; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #6D3EF3; color: white; }
  .btn-secondary { background: #e8e8e8; color: #333; }
  .btn-danger { background: #dc3545; color: white; }
  .btn-sm { padding: 5px 10px; font-size: 0.8em; }

  .activity-row { display: grid; grid-template-columns: 2fr 200px 150px 130px; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid #eee; }
  .activity-row:last-child { border-bottom: none; }
  .activity-name { font-weight: 600; }
  .activity-meta { font-size: 0.82em; color: #666; margin-top: 2px; }

  .status-block { display: flex; flex-direction: column; gap: 4px; }
  select.status-select { padding: 6px 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 0.85em; font-weight: 600; width: 100%; cursor: pointer; }
  select.status-select.Done { background: #d4edda; color: #155724; border-color: #c3e6cb; }
  select.status-select.InProgress { background: #fff3cd; color: #856404; border-color: #ffeeba; }
  select.status-select.Blocked { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
  select.status-select.NotStarted { background: #e2e3e5; color: #383d41; border-color: #d6d8db; }

  /* Date + duration block */
  .date-block { display: flex; flex-direction: column; gap: 3px; font-size: 0.78em; color: #555; }
  .date-row { display: flex; justify-content: space-between; gap: 8px; }
  .date-row .lbl { color: #888; font-weight: 600; }
  .date-row .val { font-weight: 600; }
  .date-row.overdue .val { color: #dc3545; }
  .date-row.soon .val { color: #d39e00; }
  .duration-row {
    display: flex; justify-content: space-between; gap: 8px;
    margin-top: 4px; padding-top: 5px; border-top: 1px dashed #e0e0e0;
  }
  .duration-row .lbl { color: #6D3EF3; font-weight: 700; }
  .duration-row .val { font-weight: 700; color: #6D3EF3; }
  .duration-row.running .val { color: #856404; }
  .duration-row.running .lbl { color: #856404; }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }

  @media (max-width: 800px) {
    .activity-row { grid-template-columns: 1fr; gap: 8px; }
    .row-actions { justify-content: flex-start; }
  }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-backdrop.show { display: flex; }
  .modal { background: white; border-radius: 10px; padding: 24px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 1.2em; margin-bottom: 16px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.85em; font-weight: 600; margin-bottom: 4px; color: #444; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9em; font-family: inherit; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-group .hint { font-size: 0.75em; color: #888; margin-top: 4px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 18px; border-radius: 8px; font-size: 0.9em; opacity: 0; transform: translateY(20px); transition: all 0.3s; z-index: 200; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: #28a745; }
  .toast.error { background: #dc3545; }

  .loading { text-align: center; padding: 40px; color: #666; }
  .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #6D3EF3; border-radius: 50%; width: 28px; height: 28px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 40px; color: #999; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏗️ OCK-Site Activities Dashboard</h1>
    <button class="btn btn-secondary btn-sm" onclick="fetchLive()" title="Refresh">🔄 Refresh</button>
  </div>

  <div class="search-row">
    <div class="search-box" id="search-box">
      <span class="icon">🔍</span>
      <input id="search-input" type="text" placeholder="Search site, activity, owner, or ID..." oninput="onSearchInput()">
      <button class="clear-btn" onclick="clearSearch()" title="Clear">×</button>
    </div>
    <button class="btn-clear" id="btn-clear-filters" onclick="clearAllFilters()">Clear filters</button>
  </div>

  <div id="site-tabs" class="site-tabs"></div>
  <div id="stats" class="stats"></div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">
        Activities
        <span id="filter-summary"></span>
      </div>
      <button class="btn btn-primary" onclick="openCreateModal()">+ New Activity</button>
    </div>
    <div id="dashboard" class="loading">
      <div class="spinner"></div>
      <div>Loading...</div>
    </div>
  </div>
</div>

<div id="modal" class="modal-backdrop">
  <div class="modal">
    <h2 id="modal-title">New Activity</h2>
    <div class="form-group">
      <label>Site (free text) *</label>
      <input id="f-site" type="text" list="site-datalist" placeholder="e.g. Riverside Tower">
      <datalist id="site-datalist"></datalist>
      <div class="hint">Type any name — new sites appear as tabs automatically.</div>
    </div>
    <div class="form-group">
      <label>Activity Name *</label>
      <input id="f-name" type="text" placeholder="e.g. Foundation Excavation">
    </div>
    <div class="form-group">
      <label>Owner</label>
      <input id="f-owner" type="text" placeholder="e.g. Zaw Zaw">
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="f-status">
        <option value="Not Started">Not Started</option>
        <option value="In Progress">In Progress</option>
        <option value="Blocked">Blocked</option>
        <option value="Done">Done</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Date</label>
        <input id="f-start" type="date">
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input id="f-due" type="date">
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="Optional notes..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button id="btn-save" class="btn btn-primary" onclick="saveActivity()">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzTmDmNiTlDPfLPeMOe-TTvaZ2L5vAA6lF9yKIUo_FLfBNcQ-niGGsqaAm0OGkbyJLdAA/exec';

let currentSite = null;
let currentStatus = null;
let searchQuery = '';
let editingId = null;
let state = { sites: [], activities: [] };

/* =========================================================
   FETCH LIVE DATA
   ========================================================= */
async function fetchLive() {
  const dash = document.getElementById('dashboard');
  dash.innerHTML = '<div class="loading"><div class="spinner"></div><div>Fetching live data...</div></div>';
  document.getElementById('stats').innerHTML = '';
  document.getElementById('site-tabs').innerHTML = '';

  if (!SCRIPT_URL || SCRIPT_URL === 'YOUR_WEB_APP_URL_HERE') {
    dash.innerHTML = '<div class="empty"><p><strong>Not configured.</strong></p><p style="margin-top:8px; font-size:0.9em;">Paste your Apps Script <code>/exec</code> URL into <code>SCRIPT_URL</code>.</p></div>';
    return;
  }

  try {
    const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'Unknown error');
    state.activities = json.activities || [];
    deriveSites();
    renderAll();
  } catch (err) {
    dash.innerHTML = '<div class="empty" style="color:#dc3545">Error: ' + escapeHtml(err.message) + '</div>';
  }
}

function deriveSites() {
  const set = new Set();
  (state.activities || []).forEach(a => {
    const s = String(a['Site'] || '').trim();
    if (s) set.add(s);
  });
  state.sites = Array.from(set).sort((a, b) => a.localeCompare(b));
}

/* =========================================================
   POST
   ========================================================= */
async function postAction(payload) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error || 'Request failed');
  return json;
}

/* =========================================================
   FILTERS
   ========================================================= */
function getBaseList() {
  let list = state.activities;
  if (currentSite) {
    list = list.filter(a => String(a.Site).trim() === currentSite);
  }
  return list;
}

function getFilteredActivities() {
  let list = getBaseList();
  if (currentStatus) {
    list = list.filter(a => a.Status === currentStatus);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(a => {
      return String(a.Site || '').toLowerCase().includes(q)
          || String(a['Activity Name'] || '').toLowerCase().includes(q)
          || String(a.Owner || '').toLowerCase().includes(q)
          || String(a.ID || '').toLowerCase().includes(q);
    });
  }
  return list;
}

/* =========================================================
   RENDER
   ========================================================= */
function renderAll() {
  renderSiteTabs();
  renderDatalist();
  renderStats();
  renderDashboard();
  updateClearButton();
}

function renderSiteTabs() {
  const el = document.getElementById('site-tabs');
  el.innerHTML = '';
  el.appendChild(makeTab('__all__', 'All Sites', state.activities.length));
  state.sites.forEach(siteName => {
    const count = state.activities.filter(a => String(a.Site).trim() === siteName).length;
    el.appendChild(makeTab(siteName, siteName, count));
  });
  if (currentSite && currentSite !== '__all__' && !state.sites.includes(currentSite)) {
    currentSite = null;
  }
  el.querySelectorAll('.site-tab').forEach(t => {
    const isActive = (currentSite === null && t.dataset.id === '__all__')
                  || (currentSite === t.dataset.id);
    t.classList.toggle('active', isActive);
  });
}

function makeTab(id, label, count) {
  const tab = document.createElement('div');
  tab.className = 'site-tab';
  tab.dataset.id = id;
  tab.innerHTML = escapeHtml(label) + ' <span class="count">(' + count + ')</span>';
  tab.onclick = () => {
    currentSite = (id === '__all__') ? null : id;
    renderAll();
  };
  return tab;
}

function renderDatalist() {
  const dl = document.getElementById('site-datalist');
  dl.innerHTML = state.sites.map(s => '<option value="' + escapeHtml(s) + '"></option>').join('');
}

function renderStats() {
  const statsEl = document.getElementById('stats');
  const list = getBaseList();
  const total = list.length;
  const done = list.filter(a => a.Status === 'Done').length;
  const inProg = list.filter(a => a.Status === 'In Progress').length;
  const blocked = list.filter(a => a.Status === 'Blocked').length;
  const notStarted = list.filter(a => a.Status === 'Not Started').length;

  statsEl.innerHTML = '';
  const cards = [
    { key: null,           label: 'Total',       value: total,      cls: '' },
    { key: 'Done',         label: 'Done',        value: done,       cls: 'green' },
    { key: 'In Progress',  label: 'In Progress', value: inProg,     cls: 'yellow' },
    { key: 'Blocked',      label: 'Blocked',     value: blocked,    cls: 'red' },
    { key: 'Not Started',  label: 'Not Started', value: notStarted, cls: 'gray' }
  ];

  cards.forEach(c => {
    const card = document.createElement('div');
    card.className = 'stat-card filterable';
    if (c.key && currentStatus === c.key) card.classList.add('active');
    card.innerHTML =
      '<div class="stat-label">' + c.label + '</div>' +
      '<div class="stat-value ' + c.cls + '">' + c.value + '</div>';
    card.addEventListener('click', () => toggleStatusFilter(c.key));
    statsEl.appendChild(card);
  });
}

function toggleStatusFilter(status) {
  if (status === null) {
    currentStatus = null;
  } else if (currentStatus === status) {
    currentStatus = null;
  } else {
    currentStatus = status;
  }
  renderStats();
  renderDashboard();
  updateClearButton();
}

function renderDashboard() {
  const dash = document.getElementById('dashboard');
  const list = getFilteredActivities();
  renderFilterSummary(list);

  if (list.length === 0) {
    dash.innerHTML = '<div class="empty">No activities match your filters.</div>';
    return;
  }

  dash.innerHTML = '';
  list.forEach(a => dash.appendChild(renderRow(a)));
}

function renderFilterSummary(list) {
  const el = document.getElementById('filter-summary');
  const parts = [];
  if (currentSite) parts.push('Site: ' + currentSite);
  if (currentStatus) parts.push('Status: ' + currentStatus);
  if (searchQuery) parts.push('Search: "' + searchQuery + '"');

  if (parts.length === 0) {
    el.innerHTML = '<span style="color:#888; font-weight:normal; font-size:0.85em;"> — ' + list.length + ' shown</span>';
  } else {
    el.innerHTML = parts.map(p =>
      '<span class="filter-badge">' + escapeHtml(p) + '</span>'
    ).join('') + '<span style="color:#888; font-weight:normal; font-size:0.85em; margin-left:8px;">' + list.length + ' shown</span>';
  }
}

function renderRow(a) {
  const row = document.createElement('div');
  row.className = 'activity-row';

  const statusNoSpace = String(a.Status || 'Not Started').replace(/\s/g, '');
  const siteLabel = a.Site ? escapeHtml(a.Site) : '<em style="color:#999">no site</em>';

  const startDate = a['Start Date'] ? formatDate(a['Start Date']) : '';
  const dueDate   = a['Due Date']   ? formatDate(a['Due Date'])   : '';

  const statusOptions = ['Not Started', 'In Progress', 'Blocked', 'Done']
    .map(s => '<option value="' + s + '"' + (s === a.Status ? ' selected' : '') + '>' + s + '</option>')
    .join('');

  // ---- Build date + duration block ----
  let datesHtml = '<div class="date-block">';
  if (startDate) {
    datesHtml += '<div class="date-row"><span class="lbl">Start:</span><span class="val">' + escapeHtml(startDate) + '</span></div>';
  }
  if (dueDate) {
    const cls = dueClass(a['Due Date'], a.Status);
    datesHtml += '<div class="date-row ' + cls + '"><span class="lbl">Due:</span><span class="val">' + escapeHtml(dueDate) + '</span></div>';
  }
  if (!startDate && !dueDate) {
    datesHtml += '<div class="date-row"><span class="val" style="color:#aaa;">No dates</span></div>';
  }

  // Duration calculation
  const dur = computeDuration(a);
  if (dur) {
    const durCls = dur.running ? ' running' : '';
    datesHtml +=
      '<div class="duration-row' + durCls + '">' +
        '<span class="lbl">⏱ Duration:</span>' +
        '<span class="val">' + escapeHtml(dur.label) + (dur.running ? ' (running)' : '') + '</span>' +
      '</div>';
  }
  datesHtml += '</div>';

  row.innerHTML =
    '<div>' +
      '<div class="activity-name">' + escapeHtml(a['Activity Name'] || 'Unnamed') + '</div>' +
      '<div class="activity-meta">' + siteLabel + ' • Owner: ' + escapeHtml(a.Owner || '—') + (a.ID ? ' • ' + escapeHtml(a.ID) : '') + '</div>' +
    '</div>' +
    '<div class="status-block">' +
      '<select class="status-select ' + statusNoSpace + '" data-id="' + escapeHtml(a.ID) + '">' + statusOptions + '</select>' +
      datesHtml +
    '</div>' +
    '<div class="activity-meta">' +
      (a.Notes ? '<div style="white-space:normal;">📝 ' + escapeHtml(a.Notes) + '</div>' : '<span style="color:#bbb">No notes</span>') +
    '</div>' +
    '<div class="row-actions">' +
      '<button class="btn btn-secondary btn-sm" data-edit="' + escapeHtml(a.ID) + '">Edit</button>' +
      '<button class="btn btn-danger btn-sm" data-del="' + escapeHtml(a.ID) + '">Delete</button>' +
    '</div>';

  row.querySelector('select.status-select').addEventListener('change', function () {
    changeStatus(this.dataset.id, this.value);
  });
  row.querySelector('[data-edit]').addEventListener('click', function () {
    openEditModal(this.dataset.edit);
  });
  row.querySelector('[data-del]').addEventListener('click', function () {
    deleteActivity(this.dataset.del);
  });

  return row;
}

/* =========================================================
   DURATION LOGIC
   - Done     → start date to due date
   - Not done → start date to today
   ========================================================= */
function computeDuration(a) {
  const startRaw = a['Start Date'];
  if (!startRaw) return null;

  const start = new Date(startRaw);
  if (isNaN(start.getTime())) return null;

  const isDone = a.Status === 'Done';
  let end;

  if (isDone) {
    if (!a['Due Date']) return null;   // Done but no due date → can't calculate
    end = new Date(a['Due Date']);
    if (isNaN(end.getTime())) return null;
  } else {
    end = new Date();
  }

  // Normalize both to midnight to count whole days
  start.setHours(0, 0, 0, 0);
  end.setHours(0, 0, 0, 0);

  const diffMs = end - start;
  const days = Math.round(diffMs / (1000 * 60 * 60 * 24));

  // If due date is before start date, show 0 with a note
  if (days < 0) {
    return { label: '0 days', running: !isDone };
  }

  return {
    label: days + (days === 1 ? ' day' : ' days'),
    running: !isDone
  };
}

/* Returns 'overdue' if past due and not Done, 'soon' if within 3 days */
function dueClass(dueRaw, status) {
  if (status === 'Done' || !dueRaw) return '';
  const due = new Date(dueRaw);
  if (isNaN(due.getTime())) return '';
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  due.setHours(0, 0, 0, 0);
  const diffDays = Math.round((due - now) / (1000 * 60 * 60 * 24));
  if (diffDays < 0) return 'overdue';
  if (diffDays <= 3) return 'soon';
  return '';
}

/* =========================================================
   SEARCH
   ========================================================= */
function onSearchInput() {
  const input = document.getElementById('search-input');
  const box = document.getElementById('search-box');
  searchQuery = input.value.trim();
  box.classList.toggle('has-value', searchQuery.length > 0);
  renderDashboard();
  updateClearButton();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  searchQuery = '';
  document.getElementById('search-box').classList.remove('has-value');
  renderDashboard();
  updateClearButton();
  document.getElementById('search-input').focus();
}

function updateClearButton() {
  const btn = document.getElementById('btn-clear-filters');
  const hasFilters = !!currentSite || !!currentStatus || !!searchQuery;
  btn.classList.toggle('show', hasFilters);
}

function clearAllFilters() {
  currentSite = null;
  currentStatus = null;
  searchQuery = '';
  document.getElementById('search-input').value = '';
  document.getElementById('search-box').classList.remove('has-value');
  renderAll();
}

/* =========================================================
   ACTIONS
   ========================================================= */
async function changeStatus(id, status) {
  try {
    await postAction({ action: 'updateStatus', data: { id: id, Status: status } });
    updateLocal(id, { Status: status });
    renderAll();
    toast('Status → ' + status, 'success');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  }
}

function updateLocal(id, changes) {
  const a = state.activities.find(x => String(x.ID) === String(id));
  if (a) Object.assign(a, changes);
}

async function deleteActivity(id) {
  if (!confirm('Delete this activity?')) return;
  try {
    await postAction({ action: 'deleteActivity', id: id });
    state.activities = state.activities.filter(a => String(a.ID) !== String(id));
    deriveSites();
    renderAll();
    toast('Activity deleted', 'success');
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  }
}

/* =========================================================
   MODAL
   ========================================================= */
function openCreateModal() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'New Activity';
  document.getElementById('f-site').value = currentSite || '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-owner').value = '';
  document.getElementById('f-status').value = 'Not Started';
  document.getElementById('f-start').value = todayISO();
  document.getElementById('f-due').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('modal').classList.add('show');
  setTimeout(() => document.getElementById('f-site').focus(), 50);
}

function openEditModal(id) {
  const a = state.activities.find(x => String(x.ID) === String(id));
  if (!a) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Activity';
  document.getElementById('f-site').value = a.Site || '';
  document.getElementById('f-name').value = a['Activity Name'] || '';
  document.getElementById('f-owner').value = a.Owner || '';
  document.getElementById('f-status').value = a.Status || 'Not Started';
  document.getElementById('f-start').value = a['Start Date'] ? String(a['Start Date']).slice(0, 10) : '';
  document.getElementById('f-due').value = a['Due Date'] ? String(a['Due Date']).slice(0, 10) : '';
  document.getElementById('f-notes').value = a.Notes || '';
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  editingId = null;
}

async function saveActivity() {
  const site = document.getElementById('f-site').value.trim();
  const name = document.getElementById('f-name').value.trim();

  if (!site) { toast('Site is required', 'error'); return; }
  if (!name) { toast('Activity name is required', 'error'); return; }

  const data = {
    Site: site,
    'Activity Name': name,
    Owner: document.getElementById('f-owner').value.trim(),
    Status: document.getElementById('f-status').value,
    'Start Date': document.getElementById('f-start').value,
    'Due Date': document.getElementById('f-due').value,
    Notes: document.getElementById('f-notes').value.trim()
  };

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    if (editingId) {
      await postAction({ action: 'updateActivity', data: Object.assign({ id: editingId }, data) });
      updateLocal(editingId, data);
      toast('Activity updated', 'success');
      closeModal();
      renderAll();
    } else {
      await postAction({ action: 'createActivity', data: data });
      toast('Activity created', 'success');
      closeModal();
      await fetchLive();
    }
  } catch (err) {
    toast('Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
}

/* =========================================================
   HELPERS
   ========================================================= */
function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatDate(v) {
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toISOString().slice(0, 10);
}

function todayISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

let toastTimer = null;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.className = 'toast ' + (type || '');
  }, 2500);
}

/* =========================================================
   GLOBAL LISTENERS
   ========================================================= */
document.getElementById('modal').addEventListener('click', function (e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    const modal = document.getElementById('modal');
    if (modal.classList.contains('show')) closeModal();
  }
});

/* =========================================================
   INIT
   ========================================================= */
fetchLive();
</script>
